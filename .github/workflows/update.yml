name: Update stats

on:
  schedule:
    - cron: "0 10 * * *" # 10:00 UTC, about 6 AM Eastern
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Test
        run: npm test
      - name: Clone project repos
        env:
          KEY_LIBRISO: ${{ secrets.KEY_LIBRISO }}
          KEY_REPORTGEN: ${{ secrets.KEY_REPORTGEN }}
          KEY_THECLIMB: ${{ secrets.KEY_THECLIMB }}
          KEY_POCRD: ${{ secrets.KEY_POCRD }}
        run: bash scripts/clone.sh "$RUNNER_TEMP/repos"
      - name: Count lines
        run: node scripts/count.mjs --repos "$RUNNER_TEMP/repos"
      - name: Save numbers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update stats $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Build site
        run: |
          mkdir -p _site/data
          cp index.html calc.mjs config.json _site/
          cp data/*.json _site/data/
          # Version the module import so a fresh index.html never pairs with a cached old calc.mjs.
          sed -i "s#'./calc.mjs'#'./calc.mjs?v=${GITHUB_SHA::7}'#" _site/index.html
          grep -q "calc.mjs?v=" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
